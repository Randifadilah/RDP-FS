name: FYnixorStudio-RDP-Ngrok
on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Durasi sesi (menit), maks 350'
        required: false
        default: '350'
        type: string
      auto_shutdown:
        description: 'Matikan RDP otomatis setelah sesi habis?'
        required: false
        type: boolean
        default: true

env:
  RDP_USERNAME: YOKOTO
  RDP_PASSWORD: FYnixor87654321!
  HEARTBEAT_MINUTES: 15

# ============================================================================
# RAHASIA (GitHub Secrets) - JANGAN PERNAH DIHARDCODE
#   - TG_TOKEN            : token bot Telegram (dari @BotFather)
#   - TG_CHAT             : chat/group ID tujuan
#   - NGROK_TOKEN         : authtoken ngrok (gratis di dashboard.ngrok.com)
# ============================================================================

jobs:
  rdp-ngrok:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Setup Helper Functions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\actions | Out-Null
          $helperScript = @'

          function ConvertTo-HtmlEscaped {
              param([string]$Text)
              if ($null -eq $Text) { return "" }
              return $Text.Replace("&", "&amp;").Replace("<", "&lt;").Replace(">", "&gt;")
          }

          function Send-TelegramMessage {
              param(
                  [Parameter(Mandatory=$true)][string]$Token,
                  [Parameter(Mandatory=$true)][string]$ChatId,
                  [Parameter(Mandatory=$true)][string]$Text,
                  [int]$MaxRetries = 3
              )
              $uri = "https://api.telegram.org/bot$Token/sendMessage"
              $body = @{ chat_id = $ChatId; text = $Text; parse_mode = "HTML"; disable_web_page_preview = $true }
              $attempt = 0
              while ($attempt -lt $MaxRetries) {
                  try {
                      $resp = Invoke-RestMethod -Uri $uri -Method Post -Body $body -TimeoutSec 15
                      if ($resp.ok) { return $true }
                  } catch {
                      if ($_.Exception.Message -match "parse|Bad Request") {
                          $fallback = @{ chat_id = $ChatId; text = $Text }
                          try { $r2 = Invoke-RestMethod -Uri $uri -Method Post -Body $fallback -TimeoutSec 15; if ($r2.ok) { return $true } }
                          catch { }
                      }
                  }
                  $attempt++
                  Start-Sleep -Seconds 3
              }
              return $false
          }

          function Send-TelegramButton {
              param([string]$Token, [string]$ChatId, [string]$Text, [object[]]$Buttons)
              $uri = "https://api.telegram.org/bot$Token/sendMessage"
              $keyboard = @{ inline_keyboard = $Buttons }
              $payload = @{ chat_id = $ChatId; text = $Text; parse_mode = "HTML"; disable_web_page_preview = $true; reply_markup = ($keyboard | ConvertTo-Json -Depth 6) }
              try { $resp = Invoke-RestMethod -Uri $uri -Method Post -Body $payload -TimeoutSec 15; return $resp.ok } catch { return $false }
          }

          function Get-TelegramUpdates {
              param([string]$Token, [int]$Offset)
              $uri = "https://api.telegram.org/bot$Token/getUpdates?timeout=25&offset=$Offset"
              try { $resp = Invoke-RestMethod -Uri $uri -Method Get -TimeoutSec 30; return $resp.result } catch { return @() }
          }

          function Answer-TelegramCallback {
              param([string]$Token, [string]$CallbackId, [string]$Text)
              $uri = "https://api.telegram.org/bot$Token/answerCallbackQuery"
              $body = @{ callback_query_id = $CallbackId; text = $Text; show_alert = $false }
              try { Invoke-RestMethod -Uri $uri -Method Post -Body $body -TimeoutSec 15 } catch { }
          }

          function Get-AsciiBanner {
              param([string]$Line1 = "FYNIXOR STUDIO")
              $bar = "=" * 34
              return @"
          +----------------------------------+
          |    FYNIXOR STUDIO RDP           |
          |     $Line1
          +----------------------------------+
          "@
          }

          function Get-SystemInfoBlock {
              $os  = Get-CimInstance Win32_OperatingSystem
              $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
              $disk = Get-PSDrive C
              $freeGB = [math]::Round($disk.Free / 1GB, 1)
              $totalGB = [math]::Round(($disk.Used + $disk.Free) / 1GB, 1)
              $ramTotalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
              $ramFreeGB  = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
              $ramUsedGB  = [math]::Round($ramTotalGB - $ramFreeGB, 1)
              [pscustomobject]@{ OS = $os.Caption; CPU = $cpu.Name; RAM = "$ramUsedGB/$ramTotalGB GB"; Disk = "$freeGB/$totalGB GB" }
          }

          function Format-Duration {
              param([TimeSpan]$Span)
              $h = [int][math]::Floor($Span.TotalHours)
              $m = $Span.Minutes
              $s = $Span.Seconds
              return "$h j $m m $s d"
          }
          '@
          Set-Content -Path C:\actions\helpers.ps1 -Value $helperScript -Encoding UTF8
          Write-Host "Helpers siap."

      - name: Notify - Provisioning Started
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $msg = @"
          <b>🛒 FYnixorStudio RDP</b>
          <b>⏳ Sesi sedang disiapkan...</b>

          ⚙️ Aksi   : Menyiapkan RDP
          🕒 Waktu : <code>$(Get-Date -Format "HH:mm:ss")</code>

          Tunggu ±1-2 menit untuk info login.
          "@
          Send-TelegramMessage -Token "${{ secrets.TG_TOKEN }}" -ChatId "${{ secrets.TG_CHAT }}" -Text $msg | Out-Null

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-FYnixor" | Out-Null
          netsh advfirewall firewall add rule name="RDP-FYnixor" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: pwsh
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $env:RDP_USERNAME -Password $securePass
          } else {
              New-LocalUser -Name $env:RDP_USERNAME -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME
          }
          if (-not (Get-LocalUser -Name $env:RDP_USERNAME)) { exit 1 }

      - name: Install Ngrok
        shell: pwsh
        run: |
          $zip = "$env:TEMP\ngrok.zip"
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\Tools -Force
          Write-Host "Ngrok terinstall."

      - name: Start Ngrok TCP Tunnel
        shell: pwsh
        run: |
          & C:\Tools\ngrok\ngrok.exe config add-authtoken "${{ secrets.NGROK_TOKEN }}"
          Start-Process -FilePath "C:\Tools\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden

          $address = $null
          for ($i = 0; $i -lt 12 -and -not $address; $i++) {
              Start-Sleep -Seconds 5
              try {
                  $api = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 10
                  $tcp = $api.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
                  if ($tcp) { $address = $tcp.public_url }
              } catch { }
          }
          if (-not $address) { Write-Error "Gagal buka tunnel ngrok."; exit 1 }

          $address = $address.Replace("tcp://", "")
          echo "NGROK_ADDRESS=$address" >> $env:GITHUB_ENV
          Write-Host "Ngrok TCP aktif: $address"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $hostPart = ($env:NGROK_ADDRESS -split ":")[0]
          $portPart = ($env:NGROK_ADDRESS -split ":")[1]
          $testResult = Test-NetConnection -ComputerName $hostPart -Port $portPart
          if (-not $testResult.TcpTestSucceeded) { Write-Error "TCP gagal ke $env:NGROK_ADDRESS"; exit 1 }

      - name: Notify - Session Ready (Credentials via Ngrok, TANPA VPN)
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $sysInfo = Get-SystemInfoBlock
          $msg = @"
          <b>✅ Sesi RDP SIAP!</b>

          <b>━━━ 🔌 INFO LOGIN ━━━</b>

          🖥️ <b>Host</b>
          <code>$($env:NGROK_ADDRESS -split ':')[0]</code>
          🔢 <b>Port</b>
          <code>$($env:NGROK_ADDRESS -split ':')[1]</code>
          👤 <b>Username</b>
          <code>$env:RDP_USERNAME</code>
          🔑 <b>Password</b>
          <code>$env:RDP_PASSWORD</code>

          <b>━━━ 🖥 SISTEM ━━━</b>

          💻 OS   : <code>$(ConvertTo-HtmlEscaped $sysInfo.OS)</code>
          💾 Disk : <code>$($sysInfo.Disk)</code>

          <b>📲 Cara connect (TANPA VPN):</b>
          1. Buka Remote Desktop (mstsc)
          2. Isi Host & Port di atas
          3. Masukkan Username & Password
          4. Klik Ya saat muncul warning

          ⏱️ Sesi aktif ±<b>${{ github.event.inputs.session_minutes }}</b> menit.
          "@
          $buttons = @(
              @{ text = "🛑 Matikan Sekarang"; callback_data = "SHUTDOWN" }
          )
          Send-TelegramButton -Token "${{ secrets.TG_TOKEN }}" -ChatId "${{ secrets.TG_CHAT }}" -Text $msg -Buttons $buttons | Out-Null

      - name: Maintain Connection (Watchdog + Heartbeat)
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $startTime = Get-Date
          $heartbeatMinutes = [int]$env:HEARTBEAT_MINUTES
          $lastHeartbeat = $startTime
          $offset = 0

          while ($true) {
              Start-Sleep -Seconds 30
              $updates = Get-TelegramUpdates -Token "${{ secrets.TG_TOKEN }}" -Offset $offset
              foreach ($u in $updates) {
                  $offset = $u.update_id + 1
                  $cb = $u.callback_query
                  if ($cb -and $cb.data -eq "SHUTDOWN") {
                      Answer-TelegramCallback -Token "${{ secrets.TG_TOKEN }}" -CallbackId $cb.id -Text "Mematikan RDP..."
                      Send-TelegramMessage -Token "${{ secrets.TG_TOKEN }}" -ChatId "${{ secrets.TG_CHAT }}" -Text "🛑 RDP dimatikan. Sampai jumpa!" | Out-Null
                      Stop-Process -Id $PID -Force
                  }
              }
              $now = Get-Date
              $elapsed = $now - $startTime
              if (($now - $lastHeartbeat).TotalMinutes -ge $heartbeatMinutes) {
                  $sys = Get-SystemInfoBlock
                  $hbMsg = @"
          💓 <b>Heartbeat - FYnixorStudio RDP</b>
          🟢 Status : AKTIF
          📍 Endpoint : <code>$env:NGROK_ADDRESS</code>
          ⏱ Uptime : $(Format-Duration $elapsed)
          💾 Disk : $($sys.Disk)
          "@
                  Send-TelegramMessage -Token "${{ secrets.TG_TOKEN }}" -ChatId "${{ secrets.TG_CHAT }}" -Text $hbMsg | Out-Null
                  $lastHeartbeat = $now
              }
          }

      - name: Notify - Session Ended
        if: always()
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $status = "${{ job.status }}"
          $msg = @"
          <b>🔴 Sesi RDP selesai.</b>
          📊 Status : <code>$status</code>
          🕒 Waktu : <code>$(Get-Date -Format "HH:mm:ss")</code>

          Terima kasih sudah berbelanja di FYnixorStudio ✅
          "@
          Send-TelegramMessage -Token "${{ secrets.TG_TOKEN }}" -ChatId "${{ secrets.TG_CHAT }}" -Text $msg | Out-Null
