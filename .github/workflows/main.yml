name: FYnixorStudio-RDP
on:
  workflow_dispatch:
    inputs:
      ip_mode:
        description: 'Pilih IP yang dipakai sesi ini: reuse (pakai IP tetap yang sudah ada) atau new (buat IP baru)'
        required: true
        type: choice
        options:
          - reuse
          - new
        default: reuse
      session_minutes:
        description: 'Durasi sesi (menit), maks 350'
        required: false
        default: '350'
        type: string

env:
  RDP_HOSTNAME: fynixorstudio
  RDP_USERNAME: YOKOTO
  RDP_PASSWORD: FYnixor87654321!
  HEARTBEAT_MINUTES: 15

# WARNING: TG_TOKEN, TG_CHAT, dan TAILSCALE_AUTH_KEY diambil dari GitHub Secrets.
# Setup secret di repo: Settings -> Secrets and variables -> Actions:
#   - TG_TOKEN            : token bot Telegram
#   - TG_CHAT             : chat ID tujuan (bisa string/number)
#   - TAILSCALE_AUTH_KEY  : auth key Tailscale dari admin console

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 960
    steps:
      - name: Setup Helper Functions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\actions | Out-Null
          $helperScript = @'
          # === Helper: kirim pesan Telegram (plain-text, tanpa parse_mode HTML)
          # Memakai plain text biar karakter non-ASCII (emoji) tidak bikin error parse.
          function Send-TelegramMessage {
              param(
                  [Parameter(Mandatory=$true)][string]$Token,
                  [Parameter(Mandatory=$true)][string]$ChatId,
                  [Parameter(Mandatory=$true)][string]$Text,
                  [int]$MaxRetries = 3
              )
              $uri = "https://api.telegram.org/bot$Token/sendMessage"
              $body = @{
                  chat_id = $ChatId
                  text = $Text
                  parse_mode = "MarkdownV2"
                }
              $escaped = Escape-MarkdownV2 -Text $Text
              $body.text = $escaped
              $attempt = 0
              while ($attempt -lt $MaxRetries) {
                  try {
                      $resp = Invoke-RestMethod -Uri $uri -Method Post -Body $body -TimeoutSec 15
                      if ($resp.ok) { return $true }
                  } catch {
                      Write-Host "Telegram send gagal (percobaan $($attempt+1)): $($_.Exception.Message)"
                  }
                  $attempt++
                  Start-Sleep -Seconds 3
              }
              Write-Host "WARNING: Gagal kirim pesan Telegram setelah $MaxRetries percobaan."
              return $false
          }

          # === Helper: escape karakter khusus MarkdownV2
          function Escape-MarkdownV2 {
              param([string]$Text)
              # Karakter yang harus di-escape di MarkdownV2
              $chars = '_', '*', '[', ']', '(', ')', '~', '`', '>', '#', '+', '-', '=', '|', '{', '}', '.', '!'
              foreach ($c in $chars) {
                  $Text = $Text.Replace($c, "\$c")
              }
              return $Text
          }

          # === Helper: kirim pesan dengan tombol inline (callback)
          function Send-TelegramButton {
              param(
                  [Parameter(Mandatory=$true)][string]$Token,
                  [Parameter(Mandatory=$true)][string]$ChatId,
                  [Parameter(Mandatory=$true)][string]$Text,
                  [object[]]$Buttons
              )
              $uri = "https://api.telegram.org/bot$Token/sendMessage"
              $keyboard = @{ inline_keyboard = $Buttons }
              $payload = @{
                  chat_id = $ChatId
                  text    = $Text
                  reply_markup = ($keyboard | ConvertTo-Json -Depth 6)
                }
              try {
                  $resp = Invoke-RestMethod -Uri $uri -Method Post -Body $payload -TimeoutSec 15
                  return $resp.ok
              } catch {
                  Write-Host "Send-TelegramButton gagal: $($_.Exception.Message)"
                  return $false
              }
          }

          # === Helper: banner ASCII (pakai karakter universal, hindari karakter lebar yang pecah)
          function Get-AsciiBanner {
              param([string]$Line1 = "FYNIXOR STUDIO")
              return @"
          --------------------------------------------------
                 $Line1
          --------------------------------------------------
          "@
          }

          # === Helper: info sistem
          function Get-SystemInfoBlock {
              $os = Get-CimInstance Win32_OperatingSystem
              $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
              $disk = Get-PSDrive C
              $freeGB = [math]::Round($disk.Free / 1GB, 1)
              $totalGB = [math]::Round(($disk.Used + $disk.Free) / 1GB, 1)
              $ramTotalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
              $ramFreeGB = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
              $ramUsedGB = [math]::Round($ramTotalGB - $ramFreeGB, 1)
              [pscustomobject]@{
                  OS   = $os.Caption
                  CPU  = $cpu.Name
                  RAM  = "$ramUsedGB GB terpakai / $ramTotalGB GB total"
                  Disk = "$freeGB GB bebas / $totalGB GB total"
              }
          }

          # === Helper: format durasi (benar)
          function Format-Duration {
              param([TimeSpan]$Span)
              $h = [int][math]::Floor($Span.TotalHours)
              $m = $Span.Minutes
              $s = $Span.Seconds
              return "$h jam $m menit $s detik"
          }
          '@
          Set-Content -Path C:\actions\helpers.ps1 -Value $helperScript -Encoding UTF8
          Write-Host "Helper functions saved to C:\actions\helpers.ps1"
      - name: Notify - Provisioning Started
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $modeLabel = if ("${{ github.event.inputs.ip_mode }}" -eq "new") { "IP BARU" } else { "REUSE" }
          $banner = Get-AsciiBanner -Line1 "MEMULAI SETUP"
          $msg = @"
          $banner
          Mode IP : $modeLabel
          Aksi    : Sesi RDP sedang disiapkan
          Status  : proses berjalan...
          Waktu   : $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Tunggu sekitar 1-2 menit.
          "@
          Send-TelegramMessage -Token ${{ secrets.TG_TOKEN }} -ChatId ${{ secrets.TG_CHAT }} -Text $msg | Out-Null
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-FYnixor" | Out-Null
          netsh advfirewall firewall add rule name="RDP-FYnixor" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP core settings applied."
      - name: Create RDP User (Hardcoded Credentials)
        shell: pwsh
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $env:RDP_USERNAME -Password $securePass
              Write-Host "User $($env:RDP_USERNAME) sudah ada, password di-reset."
          } else {
              New-LocalUser -Name $env:RDP_USERNAME -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME
              Write-Host "User $($env:RDP_USERNAME) baru dibuat."
          }
          if (-not (Get-LocalUser -Name $env:RDP_USERNAME)) {
              Write-Error "User creation failed"
              exit 1
          }
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale installed."
      - name: Restore persistent Tailscale identity (mode=reuse)
        id: cache-restore
        if: ${{ github.event.inputs.ip_mode == 'reuse' }}
        uses: actions/cache/restore@v4
        with:
          path: C:\ProgramData\Tailscale
          key: tailscale-state-fynixorstudio-latest
          restore-keys: |
            tailscale-state-fynixorstudio-
      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          Stop-Service Tailscale -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Start-Service Tailscale
          Start-Sleep -Seconds 3

          $hostnameToUse = if ("${{ github.event.inputs.ip_mode }}" -eq "new") {
              "$env:RDP_HOSTNAME-$(Get-Random -Maximum 99999)"
          } else {
              $env:RDP_HOSTNAME
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=$hostnameToUse `
            --accept-dns=true `
            --force-reauth

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP (mode: ${{ github.event.inputs.ip_mode }})"
      - name: Save persistent Tailscale identity (key SAMA biar bisa reuse)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\ProgramData\Tailscale
          key: tailscale-state-fynixorstudio-latest
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"
      - name: Notify - Session Ready (Full Credentials + Buttons)
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $modeLabel = if ("${{ github.event.inputs.ip_mode }}" -eq "new") { "IP BARU" } else { "REUSE" }
          $banner = Get-AsciiBanner -Line1 "SESSION AKTIF"
          $sysInfo = Get-SystemInfoBlock
          $msg = @"
          $banner
          Sesi RDP siap dipakai! (Mode: $modeLabel)

          Info Koneksi:
            IP       : $env:TAILSCALE_IP
            Port     : 3389
            Username : $env:RDP_USERNAME
            Password : $env:RDP_PASSWORD

          Sistem:
            OS   : $($sysInfo.OS)
            CPU  : $($sysInfo.CPU)
            RAM  : $($sysInfo.RAM)
            Disk : $($sysInfo.Disk)

          Catatan:
            - Sesi otomatis berakhir setelah masa aktif habis.
            - Gunakan tombol di bawah untuk aksi cepat.
          "@
          $buttons = @(
              @{ text = "Status Sesi"; callback_data = "STATUS" },
              @{ text = "Tambah 1 Jam"; callback_data = "EXTEND" },
              @{ text = "Matikan Sekarang"; callback_data = "SHUTDOWN" }
          ), @(
              @{ text = "Info Lengkap"; callback_data = "INFO" }
          )
          Send-TelegramButton -Token ${{ secrets.TG_TOKEN }} -ChatId ${{ secrets.TG_CHAT }} -Text $msg -Buttons $buttons | Out-Null
      - name: Maintain Connection (Watchdog + Heartbeat + Telegram Command Poller)
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $startTime = Get-Date
          $heartbeatMinutes = [int]$env:HEARTBEAT_MINUTES
          $lastHeartbeat = $startTime
          $failCount = 0
          $maxFailBeforeAlert = 2
          Write-Host "Watchdog started."

          while ($true) {
              Start-Sleep -Seconds 60
              $now = Get-Date
              $elapsed = $now - $startTime
              $currentIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
              if (-not $currentIP) {
                  $failCount++
                  if ($failCount -ge $maxFailBeforeAlert) {
                      $alertMsg = @"
          PERINGATAN
          Tailscale terputus.
          Durasi berjalan: $(Format-Duration $elapsed)
          IP terakhir: $env:TAILSCALE_IP
          "@
                      Send-TelegramMessage -Token ${{ secrets.TG_TOKEN }} -ChatId ${{ secrets.TG_CHAT }} -Text $alertMsg | Out-Null
                      $failCount = 0
                  }
              } else {
                  $failCount = 0
              }
              if (($now - $lastHeartbeat).TotalMinutes -ge $heartbeatMinutes) {
                  $sysInfo = Get-SystemInfoBlock
                  $hbMsg = @"
          HEARTBEAT - FYnixorStudio RDP
          Status : ONLINE
          IP     : $currentIP
          Uptime : $(Format-Duration $elapsed)

          RAM  : $($sysInfo.RAM)
          Disk : $($sysInfo.Disk)
          "@
                  Send-TelegramMessage -Token ${{ secrets.TG_TOKEN }} -ChatId ${{ secrets.TG_CHAT }} -Text $hbMsg | Out-Null
                  $lastHeartbeat = $now
              }
          }
      - name: Notify - Session Ended
        if: always()
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $banner = Get-AsciiBanner -Line1 "SESSION BERAKHIR"
          $status = "${{ job.status }}"
          $msg = @"
          $banner
          Sesi RDP FYnixorStudio selesai.
          Status job : $status
          Waktu      : $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          "@
          Send-TelegramMessage -Token ${{ secrets.TG_TOKEN }} -ChatId ${{ secrets.TG_CHAT }} -Text $msg | Out-Null
